name: hub page
# Rebuilds the fellow's hub page from the repo. Nothing on the page is typed by hand: it runs each
# released week's gate, reads reflections/, the pull requests and the programme's hidden-eval
# check, and publishes site/ to GitHub Pages.
#
# When: every merge to main, every push to an open pull request (so the page shows the work under
# review, not last week's main), and whenever the hidden-eval check finishes. The pull-request and
# check events run in main's context, which is what lets them publish to Pages without changing
# the github-pages environment's branch rule; they check out the pull request's own commit.
# One-time setup per repo: Settings -> Pages -> Source: GitHub Actions (the token cannot do it).
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read
  checks: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the hidden-eval check rebuilds the page; other checks finishing do not.
    # Not on the programme's template repositories (variable IS_TEMPLATE=true).
    if: >-
      vars.IS_TEMPLATE != 'true' &&
      (github.event_name != 'check_run' || github.event.check_run.name == 'hidden-eval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run every released week's gate (static checks once)
        env:
          MODEL_PROVIDER: fake_a
        run: |
          first=1
          for d in weeks/*/; do
            w=$(basename "$d")
            if [ "$first" = 1 ]; then
              uv run python scripts/check.py --week "$w" || true; first=0
            else
              uv run python scripts/check.py --week "$w" --skip-static || true
            fi
          done
      - name: Run the measurement scripts that need no key (fake model, hash embedder)
        env:
          MODEL_PROVIDER: fake_a
          EMBED_PROVIDER: hash
          CHUNK_STRATEGY: paragraph
        run: |
          uv run python scripts/retrieval_eval.py || true
          uv run python scripts/degrade_repair.py --db data/pages-degrade.db || true
          uv run python scripts/eval.py --thresholds eval/thresholds-ci.json --corpus core --db data/pages-eval.db || true
          uv run python scripts/compare_week4.py --db data/pages-compare.db || true
          uv run python scripts/attack.py --db data/pages-attack.db || true
          uv run python scripts/trace_report.py --db data/pages-attack.db || true
      - name: Pull requests and the hidden-eval totals
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/hub_data.py
      - name: Build the page
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          PUBLIC_HUB: "true"  # the hidden-set numbers stay off the public page
        run: uv run python scripts/build_pages.py
      - name: Is GitHub Pages switched on for this repo?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Hub page not published::Switch Pages on once: repo Settings -> Pages -> Source: GitHub Actions. Then re-run this workflow."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
