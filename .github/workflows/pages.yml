name: progress page
# Rebuilds the fellow's progress page from the repo on every merge to main.
# Nothing on the page is typed by hand: it runs each released week's gate, reads reflections/
# and the PRs, and publishes site/ to GitHub Pages. Pages is enabled automatically on first run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run every released week's gate (static checks once)
        env:
          MODEL_PROVIDER: fake_a
        run: |
          first=1
          for d in weeks/*/; do
            w=$(basename "$d")
            if [ "$first" = 1 ]; then
              uv run python scripts/check.py --week "$w" || true; first=0
            else
              uv run python scripts/check.py --week "$w" --skip-static || true
            fi
          done
      - name: Collect PR links and mentor comment counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          echo '{}' > site/prs.json
          for d in weeks/*/; do
            w=$(basename "$d")
            pr=$(gh pr list --state all --head "week-$w" --limit 1 \
                 --json number,url,state --jq '.[0]' 2>/dev/null || echo "")
            if [ -n "$pr" ] && [ "$pr" != "null" ]; then
              num=$(echo "$pr" | jq -r .number)
              comments=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${num}/comments" --jq 'length' 2>/dev/null || echo 0)
              jq --arg w "$w" --argjson pr "$pr" --argjson c "$comments" \
                 '.[$w] = ($pr + {review_comments: $c})' site/prs.json > site/prs.tmp && mv site/prs.tmp site/prs.json
            fi
          done
          cat site/prs.json
      - name: Build the page
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: uv run python scripts/build_pages.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
