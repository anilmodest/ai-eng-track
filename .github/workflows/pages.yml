name: hub page
# Rebuilds the fellow's hub page from the repo on every merge to main.
# Nothing on the page is typed by hand: it runs each released week's gate, reads reflections/
# and the PRs, and publishes site/ to GitHub Pages.
# One-time setup per repo: Settings -> Pages -> Source: GitHub Actions (the token cannot do it).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run every released week's gate (static checks once)
        env:
          MODEL_PROVIDER: fake_a
        run: |
          first=1
          for d in weeks/*/; do
            w=$(basename "$d")
            if [ "$first" = 1 ]; then
              uv run python scripts/check.py --week "$w" || true; first=0
            else
              uv run python scripts/check.py --week "$w" --skip-static || true
            fi
          done
      - name: Run the measurement scripts that need no key (fake model, hash embedder)
        env:
          MODEL_PROVIDER: fake_a
          EMBED_PROVIDER: hash
          CHUNK_STRATEGY: paragraph
        run: |
          uv run python scripts/retrieval_eval.py || true
          uv run python scripts/degrade_repair.py --db data/pages-degrade.db || true
          uv run python scripts/eval.py --thresholds eval/thresholds-ci.json --db data/pages-eval.db || true
          uv run python scripts/compare_week4.py --db data/pages-compare.db || true
          uv run python scripts/attack.py --db data/pages-attack.db || true
          uv run python scripts/trace_report.py --db data/pages-attack.db || true
      - name: Collect PR links and mentor comment counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          echo '{}' > site/prs.json
          for d in weeks/*/; do
            w=$(basename "$d")
            pr=$(gh pr list --state all --head "week-$w" --limit 1 \
                 --json number,url,state --jq '.[0]' 2>/dev/null || echo "")
            if [ -n "$pr" ] && [ "$pr" != "null" ]; then
              num=$(echo "$pr" | jq -r .number)
              comments=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${num}/comments" --jq 'length' 2>/dev/null || echo 0)
              jq --arg w "$w" --argjson pr "$pr" --argjson c "$comments" \
                 '.[$w] = ($pr + {review_comments: $c})' site/prs.json > site/prs.tmp && mv site/prs.tmp site/prs.json
            fi
          done
          cat site/prs.json
      - name: Build the page
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: uv run python scripts/build_pages.py
      - name: Is GitHub Pages switched on for this repo?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Hub page not published::Switch Pages on once: repo Settings -> Pages -> Source: GitHub Actions. Then re-run this workflow."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
