[project]
name = "ai-eng-track"
version = "0.1.0"
description = "AI Engineering track: one service that grows week by week"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "openai>=1.40",
    "httpx>=0.27",
    "arq>=0.26",
    "redis>=5",
    "numpy>=1.26",
    "fastembed>=0.3",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "markdown-it-py>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_pages.py" = ["E501"]  # CSS and JS live in string literals

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "explore", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*", "pypdf.*", "fastembed.*", "mcp.*", "markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "week0: Week 0 checks (foundations service)",
    "week1: Week 1 checks (model as a component)",
    "week2: Week 2 checks (context and retrieval)",
    "week3: Week 3 checks (grounding and evaluation)",
    "week4: Week 4 checks (agents, tools, MCP)",
    "week5: Week 5 checks (observability and guardrails)",
    "week6: Week 6 checks (shipping)",
    "core: Core-route tier",
    "pro: Pro-route tier",
]
